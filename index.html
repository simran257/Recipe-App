<!DOCTYPE html>
<html>
<head>
    <title>Recipe Sharing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Recipe Sharing Platform</h1>

<form id="recipeForm">

<div id="recipes"></div>

<script src="script.js"></script>

</body>
</html>
